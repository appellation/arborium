[package]
name = "runtime-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arborium-plugin-runtime = { path = "../../../arborium-plugin-runtime" }
arborium-tree-sitter     = { path = "../.." }

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = false

[workspace]
